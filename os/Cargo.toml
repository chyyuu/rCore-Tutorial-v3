[package]
name = "os"
version = "0.1.0"
authors = ["Yifan Wu <shinbokuow@163.com>"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
default = []
nobios = []

[dependencies]
riscv = "0.12"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }
log = "0.4"

[profile.release]
debug = true
